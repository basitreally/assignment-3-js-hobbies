<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 3 - Basit Fayyaz (37488)</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        ul {
            list-style-type: square;
            display: inline-block;
            text-align: left;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>My Hobbies</h2>

    <button onclick="showHobbies()">Show Hobbies</button>

    <div id="hobbyList"></div>

    <script>
        function showHobbies() {
            var hobbies = [
                "Reading Books",
                "Coding",
                "Cricket",
                "Gaming",
                "Traveling"
            ];

            var list = "<ul>";

            for (var i = 0; i < hobbies.length; i++) {
                list += "<li>" + hobbies[i] + "</li>";
            }

            list += "</ul>";

            document.getElementById("hobbyList").innerHTML = list;
        }
    </script>

</body>
</html>
